schema_version: "1.0"
experiment_id: workflow-smoke
title: Workflow comparison contract smoke test
research_question: Does a staged workflow improve quality-gate outcomes over one-shot execution?
hypothesis: The staged workflow will pass the same quality gate more consistently.
comparison_axis: workflow

workflow: one_shot
provider: replay
control: one_shot
treatments:
  - staged
fixed_factors:
  fixture_revision: phase2-runner-smoke
  prompt_template_revision: "1"
task_ids:
  - smoke-task
repetitions: 3
random_seed: 20260725
quality_gate:
  acceptance:
    - [python3, -B, check.py, acceptance]
  regression:
    - [python3, -B, check.py, regression]
  lint:
    - [python3, -B, check.py, lint]
  typecheck:
    - [python3, -B, check.py, typecheck]
stop_conditions:
  max_failures: 3
  max_total_duration_ms: 900000
  fail_fast: false
execution_mode: replay
replay:
  recording_path: recordings/workflow-smoke.jsonl
live: null
runner:
  fixture_path: fixtures/runner-smoke
  command_timeout_ms: 5000
  termination_grace_ms: 500
  max_output_bytes: 65536
  max_diff_bytes: 262144

schema_version: "2.0"
experiment_id: workflow-ab-smoke
title: Synthetic offline Workflow A/B acceptance
research_question: Does Workflow Prompt structure affect this fixed synthetic task?
hypothesis: The staged Prompt may change outcomes while all non-Workflow factors remain fixed.
comparison_axis: workflow
control: one_shot
treatment: staged
provider: codex
model: fake-codex-phase4-v1
reasoning_effort: high
task_ids:
  - workflow-smoke
repetitions: 3
random_seed: 4104
task_prompt_path: prompts/codex-live-smoke.md
task_prompt_revision: synthetic-task-v1
one_shot_revision: one-shot-v1
staged_revision: staged-v1
fixture_revision: synthetic-phase3-v1
provider_timeout_ms: 600000
max_prompt_bytes: 65536
max_event_line_bytes: 1048576
max_provider_output_bytes: 16777216
sandbox: workspace-write
network_access: false
quality_gate:
  acceptance:
    - [python3, check.py, acceptance]
  regression:
    - [python3, check.py, regression]
  lint:
    - [python3, check.py, lint]
  typecheck:
    - [python3, check.py, typecheck]
runner:
  fixture_path: fixtures/codex-live-smoke
  command_timeout_ms: 10000
  termination_grace_ms: 1000
  max_output_bytes: 65536
  max_diff_bytes: 1048576
stop_conditions:
  max_failures: 2
  max_total_duration_ms: 3600000
  fail_fast: false
artifacts:
  root: .artifacts/workflow-ab
